<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <link rel="stylesheet" href="Assets/style.css" />
   <script src="Assets/Script.js" defer></script>
   <title>Goose Game</title>
</head>

<body>
    <div id="weather-info">Loading weather...</div>
    <header>
        <h1>Goose Game</h1>
        <p id="game-intro">..Reach the finish line, but watch out for traps..</p>
        <p id="game-instructions">Click the button to roll the dice!</p>
        <p id="dice-result">🎲<span id="dice">-</span></p>
    </header>

    <main>
        <div id="avatar-screen">
            <h2>Choose your goose</h2>
            <div id="avatar-options">
                <img src="Assets/Img/avatar1.png" 
                     alt="Tamarra" 
                     class="avatar" 
                     data-avatar="tamarra" />

                <img src="Assets/Img/avatar2.png" 
                     alt="Street" 
                     class="avatar" 
                     data-avatar="street" />

                <img src="Assets/Img/avatar3.png" 
                     alt="Elegant" 
                     class="avatar" 
                     data-avatar="elegant" />
            </div>
        </div>

        <div id="popup-banner">
           <div id="banner-content"> 
               <p id="game-outcome">Game</p>
            <button id="close-banner-btn">Continue</button>
           </div>
        </div>

        <ul id="path-container">
            <li id="0"></li>
            <li id="1">+5</li>
            <li id="2"></li>
            <li id="3"></li>
            <li id="4">+1</li>
            <li id="5"></li>
            <li id="6" class="rip-square"></li> 
            <li id="7"></li>
            <li id="8"></li>
            <li id="9"></li>
            <li id="10"></li>
            <li id="11">-2</li>
            <li id="12">-9</li>
            <li id="13" class="win-square"></li>
        </ul>
    </main>
</body>
</html>
